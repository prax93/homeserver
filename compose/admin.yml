---
services: 
  ntfy:
    image: binwiederhier/ntfy:v2.28
    container_name: ntfy
    volumes:
      - ~/ntfy:/var/lib/ntfy:rw
    environment:
      - TZ=Europe/Zurich
      - NTFY_LOG_LEVEL=info
      - NTFY_BASE_URL=http://ntfy.home.local
      - NTFY_UPSTREAM_BASE_URL=https://ntfy.sh
    command:
      - serve
    ports:
      - 9000:80
    restart: unless-stopped
  isponsorblock:
    image: ghcr.io/dmunozv04/isponsorblocktv:v2.6.1
    container_name: iSponsorBlockTV
    environment:
      - TZ=Europe/Zurich
      - LOG_LEVEL=debug
    volumes:
      - ~/sponsorblock:/app/data
    restart: unless-stopped
