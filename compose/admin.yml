---
services: 
  ntfy:
    image: binwiederhier/ntfy:v2.34
    container_name: ntfy
    volumes:
      - ~/ntfy:/var/lib/ntfy:rw
    environment:
      NTFY_BASE_URL: "http://ntfy.home.lan"
      NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"
    volumes:
      - /var/lib/ntfy:/var/lib/ntfy
    ports:
      - "9000:80"
    restart: unless-stopped	  
  isponsorblock:
    image: ghcr.io/dmunozv04/isponsorblocktv:v2.11.0
    container_name: iSponsorBlockTV
    environment:
      - TZ=Europe/Zurich
      - LOG_LEVEL=debug
    volumes:
      - ~/sponsorblock:/app/data
    restart: unless-stopped
